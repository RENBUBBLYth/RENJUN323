<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RENJUN 323</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#000;
    color:white;
}

/* ===== HEADER ===== */

header{
    width:100%;
    padding:25px 10%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:linear-gradient(to right,#111,#1a1a1a);
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:48px;
    font-weight:bold;
    letter-spacing:2px;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:35px;
    font-size:20px;
    transition:0.3s;
}

nav a:hover{
    color:#888;
}

/* ===== HERO ===== */

.hero{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:80px;
    padding:80px 10%;
    flex-wrap:wrap;
}

/* ===== IMAGE ===== */

.hero-image img{
    width:420px;
    max-width:90vw;
    border-radius:30px;
    object-fit:cover;
    box-shadow:0 0 40px rgba(255,255,255,0.15);
}

/* ===== TEXT ===== */

.hero-text h1{
    font-size:80px;
    margin-bottom:30px;
}

.hero-text p{
    font-size:28px;
    margin-bottom:20px;
    line-height:1.8;
}

/* ===== MOBILE ===== */

@media(max-width:900px){

header{
    flex-direction:column;
    gap:20px;
}

.logo{
    font-size:38px;
}

nav a{
    margin:0 12px;
    font-size:18px;
}

.hero{
    text-align:center;
    gap:40px;
}

.hero-text h1{
    font-size:50px;
}

.hero-text p{
    font-size:22px;
}

.hero-image img{
    width:320px;
}

}

</style>
</head>

<body>

<header>

<div class="logo">RENJUN 323</div>

<nav>
<a href="#">หน้าแรก</a>
<a href="#">ประวัติ</a>
<a href="#">วิถีซัพ</a>
<a href="#">ผลงาน</a>
<a href="#">ข่าวสาร</a>
</nav>

</header>

<section class="hero">

<div class="hero-image">
<img src="RENJUN.jpg" alt="RENJUN">
</div>

<div class="hero-text">

<h1>HUANG RENJUN</h1>

<p>黄仁俊 · 황런쥔</p>

<p>หวงเหรินจวิ้น / ฮวังอินจุน</p>

<p>เกิดวันที่ 23.03.2000</p>

</div>

</section>

</body>
</html>
